services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: montage
      POSTGRES_PASSWORD: montage
      POSTGRES_DB: montage
    ports:
      - "5432:5432"
    volumes:
      - montage_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  montage_pg:
